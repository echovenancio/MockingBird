{% extends "base.html" %}

{% block title %}Entrar {% endblock %}
{% block content %}
    <div class="mx-auto w-full md:w-1/3 text-center border-2 border-black dark:border-white px-4">
        <form action="{% url 'app:password-recovery-confirmation' token %}" method="post" class="py-4 [&_p_input]:py-2 [&_p_input]:px-2 [&_p_input]:border-2 dark:[&_p_input]:border-white dark:[&_p_input]:bg-black [&_ul_li]:text-sm [&_ul]:text-gray-300 [&_ul]:text-left [&_ul]:block [&_p_span]:text-gray-300 [&_p_span]:text-sm [&>p]:flex [&>p]:flex-col [&>p]:gap-1 [&>p]:text-left flex flex-col gap-2">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="w-full block mx-auto md:w-fit text-3xl uppercase border-2 border-black dark:border-white px-4 py-1 hover:cursor-pointer hover:bg-stone-950 hover:text-stone-950 hover:dark:bg-white hover:dark:text-stone-950" type="submit">Criar conta!</button>
        </form>
    </div>
{% endblock %}
