{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="" />
        <link rel="icon" href="favicon.png">
        <title>{% block title %}{% endblock %}</title>
        <link href="{% static 'dist/styles.css' %}" rel="stylesheet">
    </head>
    <body class="font-mono dark:bg-stone-950 dark:text-white h-screen flex flex-col gap-2 px-4">
        <header class="pt-4">
            <div class="container mx-auto flex flex-row justify-between items-center">
                <h2 class="text-4xl"><a href="/">λ</a></h2>
                <nav>
                    <ul class="flex flex-row justify-evenly gap-6">
                        <li class="border-2 border-black dark:border-white px-4 py-1 hover:cursor-pointer hover:bg-stone-950 hover:text-stone-950 hover:dark:bg-white hover:dark:text-stone-950 uppercase">
                            <a href="">
                                Cursos
                            </a>
                        </li>
                        <li class="border-2 border-black dark:border-white px-4 py-1 hover:cursor-pointer hover:bg-stone-950 hover:text-stone-950 hover:dark:bg-white hover:dark:text-stone-950 uppercase">
                            <a href="">
                                Eventos
                            </a>
                        </li>
                        <li class="border-2 border-black dark:border-white px-4 py-1 hover:cursor-pointer hover:bg-stone-950 hover:text-stone-950 hover:dark:bg-white hover:dark:text-stone-950 uppercase">
                            <a href="">
                                Forum
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>
        <main class="container mx-auto flex-grow">
            {% block content %}
            {% endblock %}
        </main>
        <footer class="container mx-auto py-4">
            Released under the MIT License.
        </footer>
    </body>
</html>
